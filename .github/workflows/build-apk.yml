
name: Build Android APK
# Build known-good VK resolver rollback 0.7.17
# Build verification for VK scanner recovery 0.7.16
# Diagnostic-only VK HLS/DASH research build 0.7.27

on:
  push:
    branches: [main, live-broadcast-duration-0.7.7, live-broadcast-duration-0.7.8, live-broadcast-progress-0.7.9, live-progress-visible-clock-0.7.10, hls-program-date-time-0.7.11, rutube-live-diagnostics-0.7.12, persistent-api-hls-diagnostics-0.7.13, hls-diagnostic-callback-fix-0.7.14, vk-live-only-selection-0.7.15, vk-live-scanner-recovery-0.7.16, vk-resolver-rollback-0.7.17, vk-live-state-filter-0.7.18, vk-live-recording-state-fix-0.7.19, vk-al-video-playerparams-probe-0.7.20, vk-native-al-video-endpoint-0.7.21, vk-full-channel-scan-and-discover-0.7.23, vk-debug-instrumentation-0.7.24, vk-debug-fix-0.7.25, vk-debug-settings-0.7.26, vk-audio-research-0.7.27]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-kp-vk-debug-0.7.27
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
